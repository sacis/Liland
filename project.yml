name: Liland
options:
  bundleIdPrefix: com.flaviasilva
  developmentLanguage: en
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Liland:
    type: application
    platform: macOS
    sources:
      - path: Liland
    info:
      path: Liland/Resources/Info.plist
      properties:
        CFBundleDisplayName: Liland
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.music
        NSAppleEventsUsageDescription: Liland needs to talk to your music app to show what's playing and let you pause and skip songs.
        NSHumanReadableCopyright: © 2026 Flávia Silva
    entitlements:
      path: Liland/Resources/Liland.entitlements
      properties:
        com.apple.security.automation.apple-events: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.flaviasilva.Liland
        PRODUCT_NAME: Liland
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
    scheme: {}
